[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teta-pi-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",
    "redis>=5.1.0",
    "celery[redis]>=5.4.0",
    # 15.10: was python-jose[cryptography]; dropped for PYSEC-2026-4298
    # (+ its ecdsa dep, PYSEC-2026-1325), neither of which has a fix
    # version. PyJWT is HS256-byte-compatible, so sessions survived.
    "PyJWT>=2.10.0",
    # was transitive via python-jose[cryptography]; we import it directly
    # (services/c2pa.py, services/device_signature.py, core/crypto.py)
    "cryptography>=44.0.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "boto3>=1.35.0",
    "anthropic>=0.40.0",
    "openai>=1.55.0",
    "rapidfuzz>=3.10.0",
    "beautifulsoup4>=4.12.0",
    "opentimestamps-client>=0.7.0",
    "aiofiles>=24.1.0",
    "pillow>=11.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
