name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy → api.tetapi.dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/tetapi_ed25519
          chmod 600 ~/.ssh/tetapi_ed25519
          ssh-keyscan -H 164.90.235.66 >> ~/.ssh/known_hosts

      - name: Sync API code
        run: |
          # --chown=root:root: without it, `-a` implies -o -g and, running as
          # root on the receiver, rsync preserves the runner's numeric uid/gid
          # (user `runner` = 1001). uid 1001 on the droplet is co-tenant
          # `hellfire`, so every deploy chowned /opt/tetapi/api to
          # hellfire:hellfire — regressing S-19 (co-tenant isolation). Forcing
          # root:root keeps the tree owned by root. (rsync ≥3.1.0 on both ends.)
          rsync -az --chown=root:root -e "ssh -i ~/.ssh/tetapi_ed25519" \
            --delete \
            --exclude='__pycache__' --exclude='*.pyc' \
            --exclude='.venv' --exclude='.env' \
            --exclude='certs/*.key.pem' \
            ./ root@164.90.235.66:/opt/tetapi/api/

      - name: Sync public certs
        run: |
          # Same uid-preserve trap as above: the certs dir + public certs
          # otherwise land as hellfire:hellfire. Force root:root.
          rsync -az --chown=root:root -e "ssh -i ~/.ssh/tetapi_ed25519" \
            certs/root_ca.cert.pem \
            certs/signing.cert.pem \
            certs/chain.cert.pem \
            root@164.90.235.66:/opt/tetapi/api/certs/

      - name: Migrate + restart
        run: |
          ssh -i ~/.ssh/tetapi_ed25519 root@164.90.235.66 bash << 'REMOTE'
          set -e
          cd /opt/tetapi/api
          # rsync -p carries the runner's dir mode (755) onto certs/; the *.key.pem
          # are excluded from sync but the dir itself must stay owner-only so no
          # co-tenant can traverse it. Re-assert 700 root:root every deploy (5.11).
          chmod 700 /opt/tetapi/api/certs
          source /opt/tetapi/venv/bin/activate
          pip install -q email-validator pgvector beautifulsoup4
          alembic upgrade head
          systemctl restart tetapi-api
          sleep 4
          systemctl is-active --quiet tetapi-api \
            && echo "✓ API up" \
            || { journalctl -u tetapi-api -n 30 --no-pager; exit 1; }
          # Celery worker + beat run the new code from the same /opt/tetapi/api
          # tree, so they must restart on every deploy too — otherwise they keep
          # executing stale task code (see 1.9 OTS calendar bug: 33 min of a
          # crashing worker because deploy only restarted the API). Always
          # restart, no file-change detection (cheap: --concurrency=1, small RAM).
          systemctl restart tetapi-celery-worker tetapi-celery-beat
          sleep 4
          systemctl is-active --quiet tetapi-celery-worker \
            && echo "✓ Celery worker up" \
            || { journalctl -u tetapi-celery-worker -n 30 --no-pager; exit 1; }
          systemctl is-active --quiet tetapi-celery-beat \
            && echo "✓ Celery beat up" \
            || { journalctl -u tetapi-celery-beat -n 30 --no-pager; exit 1; }
          REMOTE
