name: Bandit (Python security lint)

on:
  # 15.10: PR trigger added — these ran on main only, so a red result
  # was never visible on the PR that caused it and could not be made a
  # required check (an unpatched auth dependency sat red for days).
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bandit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit
        run: bandit -r app -ll
